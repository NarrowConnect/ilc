# Gera um .ipa SEM assinatura para instalação via AltStore / Sideloadly (que assinam com o Apple ID de quem instala).
# Rodar em: GitHub → Actions → "iOS IPA" → Run workflow. O arquivo sai em Artifacts da execução.
name: iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Build web + sync iOS
        run: npm run build:ios

      - name: Compilar app (sem assinatura)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ILC-Cidadao.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ILC-Cidadao-ipa
          path: ILC-Cidadao.ipa
          retention-days: 30
